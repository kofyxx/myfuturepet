name: Build Android APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Android Debug APK
        run: flutter build apk --debug

      - name: Rename APK for Release
        run: cp build/app/outputs/flutter-apk/app-debug.apk build/app/outputs/flutter-apk/MyFuturePet.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MyFuturePet-debug-apk
          path: build/app/outputs/flutter-apk/MyFuturePet.apk

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: build/app/outputs/flutter-apk/MyFuturePet.apk
          name: My Future Pet ${{ github.ref_name }}
          body: |
            Official Mobile App APK for My Future Pet (BSIT Capstone, Jagna Animal Lover and Rescue Group)
            - Universal In-App 3D Camera AR (100% Android compatible, no ARCore required)
            - Sensor-fusion floor surface tracking and ground horizon locking
            - Scientific 1:1 metric life-scale estimation with distance calibration (1.0m, 1.5m, 2.0m)
            - Rigged 3D animations (Sit, Wag Tail, Speak) with floor contact shadows
          draft: false
          prerelease: false
